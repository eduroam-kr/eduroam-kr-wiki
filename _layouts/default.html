<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page_title %}{{ page_title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ desc }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.collection == 'docs' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page_title | default: site.title }}">
<meta property="og:description" content="{{ desc }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="ko_KR">
<meta property="og:image" content="{{ og_image | absolute_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="eduroam">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title | default: site.title }}">
<meta name="twitter:description" content="{{ desc }}">
<meta name="twitter:image" content="{{ og_image | absolute_url }}">

<link rel="icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/icons/favicon-16x16.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/icons/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/icons/favicon-96x96.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/icons/android-icon-192x192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/icons/apple-icon-180x180.png' | relative_url }}">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
<script>
  // 화면이 그려지기 전에 테마를 정한다. 나중에 바꾸면 흰 화면이 한 번 번쩍인다.
  // 시스템을 고른 상태면 OS 설정을 읽는다 — Bootstrap 은 이걸 알아서 하지 않는다.
  (function () {
    var t = 'auto';
    try { t = localStorage.getItem('theme') || 'auto'; } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.bsTheme = t;
  })();
</script>
</head>
<body class="d-flex flex-column min-vh-100"
     >

{% include navbar.html %}

<main class="flex-grow-1">
  {{ content }}
</main>

{% include footer.html %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
