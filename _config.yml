title: eduroam Korea 위키
description: 대한민국 eduroam 운영 규정과 기술 규격, 운영 기록

remote_theme: eduroam-kr/multipage-jekyll-site-theme@v1.12
brand: Korea 위키

# ── 틀 너비 ───────────────────────────────────────────────────────────
#
# 단위는 rem 이다. 1rem 은 브라우저의 기본 글자 크기이고 보통 16px 이다.
# 그래서 64rem = 1024px, 83rem = 1328px 이다.
#
# px 로 박아 두면 이용자가 브라우저에서 글자를 키웠을 때 글자만 커지고 틀은
# 그대로라, 한 줄에 들어가는 글자 수가 줄어 되레 읽기 나빠진다. rem 으로 두면
# 틀도 같은 비율로 커진다. 그래서 너비는 전부 rem 으로 쓴다.
#
# 네 값이 이렇게 맞물린다.
#
#   |←────────────────── frame 83rem ──────────────────→|
#   |여백|←──── doc 64rem ────→|←2.5→|←목차 15rem→|여백|
#    0.75                       사이            0.75
#
#   doc        글줄 폭. 목차가 있든 없든 본문은 늘 이 너비다.
#   wrap       목차를 쓰지 않는 좁은 틀. 여기서는 doc 과 같게 둔다.
#   wrap_wide  본문 틀 전체. doc + 사이 여백 2.5 + 목차 15 + 안쪽 여백 1.5.
#   frame      머리글·바닥글 폭. 본문 틀과 같아야 양 끝이 맞는다.
#
# 즉 wrap_wide 와 frame 은 늘 doc + 19rem 이다. doc 을 고치면 셋을 같이 고친다.
# 규정 문서에 표와 코드가 많아 공식 웹사이트(56rem = 896px)보다 넓게 쓴다.
doc: 64rem
wrap: 64rem
wrap_wide: 83rem
frame: 83rem

url: "https://wiki.eduroam.kreonet.net"
baseurl: ""

# 빌드는 UTC 인 CI 에서 돈다. 이걸 비워 두면 오늘 날짜로 쓴 글이 "미래"가 되어
# 목록에는 뜨는데 페이지는 만들어지지 않는다.
timezone: Asia/Seoul
future: true

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

collections:
  docs:
    output: true
    permalink: /:path/

defaults:
  - scope: { path: "", type: docs }
    values: { layout: doc, toc: true, print: clean }

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
