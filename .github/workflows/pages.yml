name: Pages


on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: 링크와 빌드 결과 확인
        run: |
          test -s _site/index.html
            test -s _site/rules/notice/index.html
          test -s _site/index.html
          grep -q 'eduroam' _site/index.html
          # front matter 가 깨지면 Jekyll 이 조용히 레이아웃 없이 본문만 내놓는다.
          # description 안의 콜론 하나로 그렇게 된 적이 있다. 그대로 배포되지 않게 막는다.
          bare=$(find _site -name '*.html' ! -exec grep -qil '^<!doctype html>' {} \; -print)
          test -z "$bare" || { echo "레이아웃 없이 생성된 페이지:"; echo "$bare"; exit 1; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
